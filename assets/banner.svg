<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #e2e8f0;
    }
    .node-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #38bdf8;
    }
    .node-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
    }

    /* Dynamic CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes rotateDb {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulsing-bg-1 { animation: pulseGlow 6s ease-in-out infinite; transform-origin: 200px 100px; }
    .pulsing-bg-2 { animation: pulseGlow 8s ease-in-out infinite 2s; transform-origin: 1000px 220px; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2.5s; }
    .flow-line { stroke-dasharray: 8 6; animation: dashStream 2s linear infinite; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1196" height="316" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Kept in distant background behind text) -->
  <circle class="pulsing-bg-1" cx="150" cy="80" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle class="pulsing-bg-2" cx="1050" cy="240" r="200" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Connection Streams (Background Right side) -->
  <path d="M 750 100 Q 880 40 1000 110 T 1120 180" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 720 180 Q 850 250 980 190 T 1140 220" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" class="flow-line" />

  <!-- Floating Glowing Particles -->
  <circle class="particle-1" cx="220" cy="50" r="4" fill="#38bdf8" />
  <circle class="particle-2" cx="950" cy="60" r="5" fill="#a78bfa" />
  <circle class="particle-3" cx="1100" cy="120" r="3" fill="#34d399" />
  <circle class="particle-1" cx="800" cy="270" r="4" fill="#f472b6" />

  <!-- RIGHT SIDE: DECORATIVE ARCHITECTURE CARDS (Positioned to right, leaving foreground text clear) -->
  <g transform="translate(740, 50)">
    <!-- PostgreSQL / MySQL Card -->
    <rect x="0" y="0" width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="35" r="14" fill="#0284c7" opacity="0.3" />
    <path d="M 20 30 C 20 25 36 25 36 30 C 36 35 20 35 20 30 Z M 20 30 L 20 40 C 20 45 36 45 36 40 L 36 30" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="52" y="32" class="node-title">Relational DBs</text>
    <text x="52" y="48" class="node-sub">Postgres • MySQL • SQL Server</text>
  </g>

  <g transform="translate(950, 110)">
    <!-- GUI & Clients Card -->
    <rect x="0" y="0" width="190" height="70" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="35" r="14" fill="#7c3aed" opacity="0.3" />
    <rect x="20" y="24" width="16" height="18" rx="2" fill="none" stroke="#c084fc" stroke-width="2" />
    <line x1="20" y1="30" x2="36" y2="30" stroke="#c084fc" stroke-width="1.5" />
    <text x="52" y="32" class="node-title">Universal IDEs</text>
    <text x="52" y="48" class="node-sub">DBeaver • DataGrip • TablePlus</text>
  </g>

  <g transform="translate(780, 180)">
    <!-- DevOps & Schema Card -->
    <rect x="0" y="0" width="180" height="70" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="35" r="14" fill="#059669" opacity="0.3" />
    <path d="M 22 28 L 28 22 L 34 28 M 28 22 L 28 44" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="32" class="node-title">GitOps & Schema</text>
    <text x="52" y="48" class="node-sub">Bytebase • ChartDB • Adminer</text>
  </g>

  <!-- FOREGROUND CONTENT (LEFT SIDE - CLEAR & READABLE) -->
  <!-- Top Pill / Badge -->
  <g transform="translate(60, 45)">
    <rect width="260" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="15" cy="15" r="5" fill="#10b981" />
    <text x="30" y="20" class="badge-text">⚡ CURATED DBA TOOLKIT • 2026</text>
  </g>

  <!-- MAIN TITLE (Foreground) -->
  <text x="60" y="125" class="title">Awesome Database</text>
  <text x="60" y="175" class="title" fill="url(#accentCyan)">Administration Tools</text>

  <!-- SUBTITLE (Foreground) -->
  <text x="60" y="222" class="subtitle">Top Commercial &amp; Open-Source SQL Clients, GUIs &amp; Schema IDEs</text>

  <!-- BOTTOM FEATURE BADGES -->
  <g transform="translate(60, 252)">
    <!-- Tag 1 -->
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8">🗄️ Multi-Engine</text>

    <!-- Tag 2 -->
    <rect x="142" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="156" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#a78bfa">⚡ High Performance</text>

    <!-- Tag 3 -->
    <rect x="284" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="298" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399">🔓 100% Free &amp; Open</text>
  </g>

</svg>
