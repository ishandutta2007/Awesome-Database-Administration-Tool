<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .node-title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #38bdf8;
    }
    .node-sub {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #94a3b8;
    }
    .tag-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
    }

    /* CSS Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.5; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); opacity: 0.3; }
      50% { transform: translateY(-10px); opacity: 0.8; }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-bg-1 { animation: pulseGlow 5s ease-in-out infinite; }
    .pulsing-bg-2 { animation: pulseGlow 7s ease-in-out infinite 1s; }
    .particle-1 { animation: floatParticle 4s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .flow-line { stroke-dasharray: 6 4; animation: dashStream 3s linear infinite; }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1196" height="316" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Background Glowing Orbs -->
  <circle class="pulsing-bg-1" cx="150" cy="80" r="140" fill="#3b82f6" opacity="0.3" />
  <circle class="pulsing-bg-2" cx="1050" cy="240" r="160" fill="#8b5cf6" opacity="0.3" />

  <!-- Connection Streams -->
  <path d="M 740 85 Q 870 30 990 100 T 1110 170" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.3" class="flow-line" />
  <path d="M 720 175 Q 850 245 980 185 T 1130 215" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3" class="flow-line" />

  <!-- Floating Particles -->
  <circle class="particle-1" cx="220" cy="50" r="4" fill="#38bdf8" />
  <circle class="particle-2" cx="950" cy="60" r="5" fill="#a78bfa" />
  <circle class="particle-1" cx="1100" cy="120" r="3" fill="#34d399" />

  <!-- RIGHT SIDE: CARDS -->
  <g transform="translate(740, 45)">
    <rect width="190" height="65" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="#0284c7" opacity="0.3" />
    <path d="M 20 27 C 20 23 36 23 36 27 C 36 31 20 31 20 27 Z M 20 27 L 20 37 C 20 41 36 41 36 37 L 36 27" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="52" y="30" class="node-title">Relational DBs</text>
    <text x="52" y="46" class="node-sub">Postgres • MySQL • SQL Server</text>
  </g>

  <g transform="translate(950, 110)">
    <rect width="190" height="65" rx="10" fill="url(#cardGrad)" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="#7c3aed" opacity="0.3" />
    <rect x="20" y="23" width="16" height="18" rx="2" fill="none" stroke="#c084fc" stroke-width="2" />
    <line x1="20" y1="29" x2="36" y2="29" stroke="#c084fc" stroke-width="1.5" />
    <text x="52" y="30" class="node-title">Universal IDEs</text>
    <text x="52" y="46" class="node-sub">DBeaver • DataGrip • TablePlus</text>
  </g>

  <g transform="translate(780, 175)">
    <rect width="190" height="65" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="28" cy="32" r="14" fill="#059669" opacity="0.3" />
    <path d="M 22 26 L 28 20 L 34 26 M 28 20 L 28 40" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
    <text x="52" y="30" class="node-title">GitOps &amp; Schema</text>
    <text x="52" y="46" class="node-sub">Bytebase • ChartDB • Adminer</text>
  </g>

  <!-- FOREGROUND CONTENT -->
  <!-- Top Pill -->
  <g transform="translate(60, 45)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="32" y="20" class="badge-text">CURATED DBA TOOLKIT • 2026</text>
  </g>

  <!-- MAIN TITLE -->
  <text x="60" y="125" class="title">Awesome Database</text>
  <text x="60" y="175" class="title" fill="url(#accentCyan)">Administration Tools</text>

  <!-- SUBTITLE -->
  <text x="60" y="222" class="subtitle">Top Commercial &amp; Open-Source SQL Clients, GUIs &amp; Schema IDEs</text>

  <!-- BOTTOM FEATURE BADGES -->
  <g transform="translate(60, 252)">
    <!-- Tag 1 -->
    <rect width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="14" y="18" class="tag-text" fill="#38bdf8">Multi-Engine</text>

    <!-- Tag 2 -->
    <rect x="142" width="140" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="156" y="18" class="tag-text" fill="#a78bfa">High Performance</text>

    <!-- Tag 3 -->
    <rect x="294" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="308" y="18" class="tag-text" fill="#34d399">100% Free &amp; Open</text>
  </g>

</svg>
