<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".95"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient></defs><style>@keyframes pulseGlow{0%{opacity:.2}50%{opacity:.5}}@keyframes floatParticle{0%{transform:translateY(0);opacity:.3}50%{transform:translateY(-10px);opacity:.8}}@keyframes dashStream{0%{stroke-dashoffset:40}}.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:44px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.badge-text,.node-sub,.node-title,.tag-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.node-title{font-weight:700;font-size:15px;fill:#38bdf8}.node-sub,.tag-text{font-size:12px}.node-sub{font-weight:400;fill:#94a3b8}.tag-text{font-weight:600}.pulsing-bg-1{animation:pulseGlow 5s ease-in-out infinite}.pulsing-bg-2{animation:pulseGlow 7s ease-in-out infinite 1s}.particle-1{animation:floatParticle 4s ease-in-out infinite}.particle-2{animation:floatParticle 6s ease-in-out infinite 2s}.flow-line{stroke-dasharray:6 4;animation:dashStream 3s linear infinite}</style><rect width="1200" height="320" fill="url(#bgGradient)" rx="16"/><rect width="1196" height="316" x="2" y="2" fill="none" stroke="#334155" stroke-width="2" rx="15"/><circle cx="150" cy="80" r="1